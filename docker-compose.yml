version: '3.8'

services:
  bos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bos-operating-system
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/bos.db
      - NODE_ENV=production
      - ORDER_WEBHOOK_SECRET=${ORDER_WEBHOOK_SECRET:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      # Single-file SQLite WAL persistence
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/pulse"]
      interval: 15s
      timeout: 3s
      retries: 3
